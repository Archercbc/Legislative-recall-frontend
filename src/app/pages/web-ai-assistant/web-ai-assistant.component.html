<!-- Web AI 助手 - 懸浮窗口 -->
<div class="ai-assistant-container" [class.expanded]="isExpanded">
  
  <!-- 聊天窗口標題欄 -->
  <div class="chat-header" (click)="toggleExpanded()">
    <div class="header-content">
      <div class="ai-avatar">
        <img src="/web_logo.png" alt="AI Assistant" class="avatar-image">
      </div>
      <div class="header-text" *ngIf="isExpanded">
        <span class="title">AI 助手立委數據分析平台</span>
        <small class="subtitle">智能數據分析與問答</small>
      </div>
    </div>
    <div class="header-actions" *ngIf="isExpanded">
      <c-badge 
        *ngIf="messages.length > 1" 
        color="success" 
        shape="rounded-pill"
        class="message-count">
        {{ messages.length - 1 }}
      </c-badge>
      <button 
        class="minimize-btn"
        (click)="toggleExpanded(); $event.stopPropagation()"
        title="最小化">
        <svg cIcon name="cilMinus"></svg>
      </button>
    </div>
  </div>

  <!-- 聊天窗口內容 -->
  <div class="chat-content" *ngIf="isExpanded">
    <!-- 錯誤提示 -->
    <div class="error-container" *ngIf="showError">
      <c-alert color="danger" dismissible (close)="closeError()">
        <h6>⚠️ 錯誤</h6>
        <p>{{ errorMessage }}</p>
      </c-alert>
    </div>
   
    <!-- 訊息區域 -->
    <div class="messages-container" #messagesContainer>
      <div class="messages-list">
        <div 
          *ngFor="let message of messages; trackBy: trackByMessageId"
          class="message-item"
          [class.user-message]="message.type === 'user'"
          [class.assistant-message]="message.type === 'assistant'">
          
          <!-- 用戶訊息 -->
          <div *ngIf="message.type === 'user'" class="user-message-bubble">
            <div class="message-text">{{ message.content }}</div>
            <div class="message-time">{{ formatTime(message.timestamp) }}</div>
          </div>

          <!-- AI助理訊息 -->
          <div *ngIf="message.type === 'assistant'" class="assistant-message-bubble">
            <div class="assistant-avatar">
              <img src="/web_logo.png" alt="AI Assistant" class="avatar-image">
            </div>
            <div class="assistant-content">
              <div class="message-text" [innerHTML]="message.content | markdown"></div>
              <div class="message-time">{{ formatTime(message.timestamp) }}</div>
            </div>
          </div>
        </div>

        <!-- 打字指示器 -->
        <div *ngIf="isTyping" class="message-item assistant-message">
          <div class="assistant-message-bubble">
            <div class="assistant-avatar">
              <img src="/web_logo.png" alt="AI Assistant" class="avatar-image">
            </div>
            <div class="assistant-content">
              <div class="typing-indicator">
                <span class="typing-text">AI 助手正在思考</span>
                <div class="typing-dots">
                  <span></span>
                  <span></span>
                  <span></span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 輸入區域 -->
    <div class="input-container">
      <div class="input-wrapper">
        <div class="input-field">
          <textarea
            #messageInput
            [(ngModel)]="currentMessage"
            (keydown)="onKeyPress($event)"
            (input)="autoResizeTextarea($event)"
            [disabled]="isTyping"
            class="message-input"
            placeholder="輸入您的問題..."
            rows="1">
          </textarea>
          <button
            type="button"
            class="send-button"
            (click)="sendMessage()"
            [disabled]="!currentMessage.trim() || isTyping"
            title="發送訊息">
            <svg cIcon name="cilSend"></svg>
          </button>
        </div>
      </div>
      
      <!-- 快速問題按鈕 -->
      <div class="quick-questions" *ngIf="messages.length === 1">
        <div class="quick-questions-title">快速問題：</div>
        <div class="quick-buttons">
          <button 
            class="quick-btn"
            (click)="sendQuickQuestion('這個網站有什麼功能？')">
            網站功能
          </button>
          <button 
            class="quick-btn"
            (click)="sendQuickQuestion('請介紹立委數據分析')">
            數據分析
          </button>
          <button 
            class="quick-btn"
            (click)="sendQuickQuestion('如何查看文字雲？')">
            文字雲
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 懸浮按鈕提示 -->
<div class="floating-hint" *ngIf="!isExpanded && messages.length === 1">
  <div class="hint-bubble">
    <span>💬 有問題嗎？點我開始對話！</span>
  </div>
</div>
