<div class="county-detail-container">
  <h2>{{ countyId }} 立法委員</h2>

  <div class="spinner-container" *ngIf="loading">
    <c-spinner variant="grow">
      <span class="visually-hidden">載入中...</span>
    </c-spinner>
  </div>

  <div class="politicians-container" *ngIf="!loading">
    <div class="politician-card" *ngFor="let politician of politicians" (click)="goToPolitician(politician)">
      <!-- 立委照片 -->
      <div class="politician-photo">
        <img
          [src]="politician.image_url"
          [alt]="politician.name"
          (error)="onImageError($event)"
        />
      </div>

      <!-- 立委姓名 -->
      <div class="politician-name">
        {{ politician.name }}
      </div>

      <!-- 選區資訊 -->
      <div class="politician-district">
        {{ politician.district }}
      </div>

      <!-- 網路聲量調查 -->
      <div class="survey-info">
        網路聲量調查
      </div>
    </div>
  </div>

  <!-- 如果沒有資料 -->
  <div class="no-data" *ngIf="!loading && politicians.length === 0">
    目前沒有 {{ countyId }} 的立委資料
  </div>
</div>
